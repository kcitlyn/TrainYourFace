name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The install-without-a-compiler claim is the project's main promise, so it's
    # tested on all three target platforms rather than asserted in the README.
    # A dlib-based project could not pass this job at all.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (core + dev, no compiler needed)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov ruff

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        # Excludes tests needing a webcam, downloaded weights, or torch. Those
        # run in the `train` job below on one platform, since installing torch
        # across the full matrix would triple CI time for little added signal.
        run: pytest -q -m "not camera and not slow and not train"

  train-extra:
    # Verifies the training and export path on one platform. Separate job so a
    # torch resolution failure doesn't mask a core-install regression.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with train + export extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[train,export]" pytest

      - name: Test (including torch-dependent tests)
        run: pytest -q -m "not camera and not slow"

      - name: Verify the CLI is wired up
        # Catches a broken import or a typer signature error, which unit tests
        # can miss entirely since they import modules directly.
        run: |
          tyf --help
          for cmd in watch enroll list forget capture manifest train eval calibrate export bench info; do
            tyf "$cmd" --help > /dev/null || exit 1
          done
          echo "all subcommands resolve"
