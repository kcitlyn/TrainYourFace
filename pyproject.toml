# Build/packaging config for the `trainyourface` package.
#
# PEP 621 layout with a `src/` src-layout (code in src/trainyourface/) so the
# installed package — not the working directory — is what gets imported during
# tests. Avoids the footgun where `import trainyourface` silently picks up the
# source folder instead of the installed package.
#
# The dependency story here IS the product. The whole point of this project is
# that installing it needs no CMake, no C++ toolchain, and no dlib — so the core
# deps are deliberately restricted to things that ship
# prebuilt wheels on every platform we target (macOS arm64, Linux x86_64,
# linux-aarch64 for Raspberry Pi). Torch is NOT a core dep: inference runs on
# ONNX Runtime alone, and training lives behind the [train] extra.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trainyourface"
version = "0.2.0"
description = "Offline face recognition that knows when it's being fooled. No dlib, no CMake."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kaitlyn Chen" }]
keywords = [
    "face-recognition",
    "anti-spoofing",
    "liveness-detection",
    "presentation-attack-detection",
    "face-anti-spoofing",
    "biometrics",
    "onnx",
    "edge-ai",
    "coreml",
    "offline",
]
# Specific versions are listed rather than bare "Python :: 3" because PyPI's
# left-hand filters key on the exact entries, so a bare 3 is invisible to anyone
# narrowing by version. The range must match requires-python or the page
# contradicts the resolver.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Typing :: Typed",
]


# Core = inference only, and every one of these has prebuilt wheels for
# macOS arm64 / linux x86_64 / linux aarch64. No build step, ever.
#   onnxruntime   -> runs both the detector/embedder and the liveness model
#   opencv-*-headless -> camera + image ops WITHOUT pulling a GUI stack; the
#                        optional live viewer upgrades this via the [demo] extra
#   typer/pydantic -> CLI + validated data contracts (same pattern as edgedoctor)
dependencies = [
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9",
    "numpy>=1.24",
    "typer>=0.26",
    "pydantic>=2.7",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# Training the liveness model. Heavy, GPU-ish, and NOT needed to use the tool —
# users consume the exported .onnx. Kept out of core so install stays fast.
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]
# Export/benchmark toolchain. coremltools is macOS-relevant only; onnx gives us
# graph surgery and INT8 quantization.
#
# onnxscript is not optional despite looking like an internal detail: torch >=2.6
# routes torch.onnx.export through its dynamo-based exporter, which imports
# onnxscript. Without it export dies with a bare ModuleNotFoundError deep inside
# torch, which reads like a broken install rather than a missing extra.
export = [
    "onnx>=1.16",
    "onnxscript>=0.1",
    "coremltools>=8.0; sys_platform == 'darwin'",
]
# The live webcam viewer needs real OpenCV with GUI support (cv2.imshow).
# Installing this replaces the headless build.
demo = ["opencv-python>=4.9"]

# Without these the PyPI page has no link back to the repository, which for this
# project is most of the point — the argument for it is in the code and the
# metrics, not in a package description.
[project.urls]
Homepage = "https://github.com/kcitlyn/TrainYourFace"
Repository = "https://github.com/kcitlyn/TrainYourFace"
Issues = "https://github.com/kcitlyn/TrainYourFace/issues"
Changelog = "https://github.com/kcitlyn/TrainYourFace/releases"

[dependency-groups]
# Dev tooling (uv installs these by default with `uv sync`).
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5"]

[project.scripts]
trainyourface = "trainyourface.cli.main:main"
tyf = "trainyourface.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trainyourface"]
# py.typed ships the "this package has real annotations" marker; without it in the
# wheel, mypy/pyright ignore every type in here and the Typing::Typed classifier
# on the PyPI page would be claiming something users can't actually use.
artifacts = ["src/trainyourface/py.typed"]

# The sdist otherwise carries .github/, .gitignore and .python-version — harmless,
# since they're in the public repo anyway, but they aren't part of the package.
[tool.hatch.build.targets.sdist]
include = ["src/trainyourface", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 (line length) is handled by the formatter; B008 fights typer's
# Argument()/Option() defaults, which are the documented idiom.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Marks let CI skip anything needing a webcam, real model weights, or a GPU.
markers = [
    "slow: needs model weights or real hardware",
    "camera: needs a physical webcam",
    "train: needs the [train] extra (torch)",
]
